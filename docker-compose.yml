services:
  supertokens:
    image: supertokens/supertokens-postgresql:12.0.7
    ports:
      - "3567:3567"
    environment:
      POSTGRESQL_CONNECTION_URI: "postgresql://${SUPERTOKENS_DB_USER}:${SUPERTOKENS_DB_PASSWORD}@host.docker.internal:${DB_PORT}/${DB_NAME}"
      POSTGRESQL_TABLE_SCHEMA: "supertokens_core"
      API_KEYS: "${SUPERTOKENS_API_KEY}"
      # token (SuperTokens defaults are 1hr / 100 days — too loose for this).
      # Units differ: access token is SECONDS, refresh token is MINUTES.
      ACCESS_TOKEN_VALIDITY: "900"
      REFRESH_TOKEN_VALIDITY: "720"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3567/hello"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped